name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Go vet + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o /dev/null ./cmd/ctx

  commitlint:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Lint commits since base
        run: npx commitlint --from origin/main --to HEAD --verbose